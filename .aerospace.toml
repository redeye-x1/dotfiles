# AeroSpace Configuration
# https://github.com/nikitabobko/AeroSpace

# Start AeroSpace at login
start-at-login = true

# SketchyBar starts on its own via `brew services`, so nothing to launch here.

# Normalizations. See: https://nikitabobko.github.io/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Prevent automatic focus following
automatically-unhide-macos-hidden-apps = false

# Notify SketchyBar about workspace and focus changes. AeroSpace emits no window
# events, so these two triggers are what keeps the workspace app icons current;
# without them the bar falls back to its 5 second poll.
on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_workspace_change',
]
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Fires whenever a new window appears, which is what keeps the workspace app
# icons current when an app launches. Window closes have no callback, but focus
# moves away from a closed window, so on-focus-changed covers those in practice.
# Must stay below the root-level keys above: this is an array of tables, and any
# bare key after it would be parsed as part of it.
[[on-window-detected]]
run = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.right = 10
# Per-monitor top gap: 10 for built-in display, 49 for any external monitor (default)
outer.top = [{ monitor.'built-in' = 10 }, 49]

# Mode definitions
[mode.main.binding]
# Hyperkey is Ctrl+Alt+Cmd (meh key without Shift)

# Focus windows
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

# Move windows
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# Switch to workspace
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'

# Move window to workspace
ctrl-alt-cmd-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
ctrl-alt-cmd-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
ctrl-alt-cmd-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
ctrl-alt-cmd-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
ctrl-alt-cmd-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
ctrl-alt-cmd-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']

# Toggle floating mode
ctrl-alt-cmd-space = 'layout floating tiling'

# Resize mode
ctrl-alt-cmd-r = 'mode resize'

# Layout manipulation
ctrl-alt-cmd-f = 'fullscreen'
ctrl-alt-cmd-s = 'layout v_accordion'  # stack
ctrl-alt-cmd-t = 'layout tiles'         # tile
ctrl-alt-cmd-e = 'layout h_accordion'  # horizontal

# Resize mode
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
